name = "atlas-action-tracker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "atlas.ransomed.app", custom_domain = true }
]

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
NODE_ENV = "production"
CF_ACCESS_TEAM_DOMAIN = "ransomedadebayo"
CF_ACCESS_AUD = "d6cc947de1c5940fd3477afe8ad4f059328b92ce24353de484b6f6e14d8650fe"
CF_ACCESS_ISSUER = "https://ransomedadebayo.cloudflareaccess.com"
CF_ACCESS_JWKS_URL = "https://ransomedadebayo.cloudflareaccess.com/cdn-cgi/access/certs"

# Secrets set via: wrangler secret put <NAME>
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# ATLAS_OWNER_EMAILS (comma-separated exact owner email allowlist)
# ATLAS_API_PRINCIPALS_JSON ({"codex":{"token":"...","scopes":[...]},"claude":{...}})
